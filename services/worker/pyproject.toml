[project]
name = "igs-worker"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "igs-common",
    "opentelemetry-sdk>=1.45.1",
    "temporalio>=1.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/igs_worker"]
