[project]
name = "igs-core"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.161.0",
    "httpx>=0.28.1",
    "igs-common",
    "mcp>=2.3.0",
    "sse-starlette>=3.5.0",
    "temporalio>=1.34.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/igs_core"]
