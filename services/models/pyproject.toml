[project]
name = "igs-models"
version = "0.1.0"
description = "IGS OS embeddings (BGE-M3 dense+sparse) and reranker (bge-reranker-v2-m3) service"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.161.0",
    "huggingface-hub>=2.2.0",
    "numpy>=2.5.4",
    "pydantic>=2",
    "pydantic-settings>=2.16.1",
    "safetensors>=0.8.0",
    "torch>=2.14.1",
    "transformers>=5.20.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/igs_models"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: loads real model weights (run with -m slow)"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["igs_models"]

# Linux images use the CPU-only torch build (no CUDA libraries in the image). macOS keeps PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
