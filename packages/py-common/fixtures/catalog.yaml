documents:
  # Payment and cancellation terms mirror IGS's published Terms & Conditions
  # (infinityglobalsports.com/terms-and-conditions, checked 2026-10-22): "$95 enrollment fee";
  # manual plan "first payment of $500 due 30 days after enrollment; second payment of $500 due
  # 90 days after enrollment; final balance due 110 days before departure"; cancellation tiers at
  # 150 / 149-110 / 109-45 / 44 days. Key kept stable for references; content follows the terms.
  - key: deposits-and-payment-schedule
    title: Enrollment fee and payment schedule
    source: policy
    mime_type: text/markdown
    content: Each traveler enrolls with a non-refundable $95 enrollment fee. Travelers can pay in full
      at enrollment or use the payment plan, invoiced in up to three payments - $500 due 30 days after
      enrollment, $500 due 90 days after enrollment, and the final balance due 110 days before
      departure. A $100 late fee applies to any missed payment, and a $50 fee to returned or declined
      payments. An automatic plan is also available (at least three monthly payments, scheduled
      between the 1st and 26th of the month). There is no separate percentage deposit.
  - key: cancellation-policy
    title: Cancellation policy
    source: policy
    mime_type: text/markdown
    content: 150 days or more before departure, full refund less the $95 enrollment fee. 149 to 110
      days, full refund less the $95 fee, all non-refundable fees and a $300 cancellation fee. 109 to
      45 days, full refund less the $95 fee, all non-refundable fees and 50% of the program price. 44
      days or less, no refund except under the Flexible Travel Program. A traveler can be replaced
      until 110 days before departure (a $100 substitution fee applies from 149 to 110 days).
      Refunds are processed within 4-6 weeks. We strongly recommend travel insurance.
  - key: what-the-price-includes
    title: What the price includes
    source: policy
    mime_type: text/markdown
    content: Prices are per person and include hotel (twin/triple rooms), private bus for the whole stay,
      all matches with certified referees, training sessions, listed experiences, bilingual tour leader
      24/7, and breakfast daily. Flights to the destination are not included; we can quote group airfare
      separately.
  - key: coach-and-staff-spots
    title: Coach and staff spots
    source: policy
    mime_type: text/markdown
    content: One free coach spot for every 15 paying players. Additional staff pay the adult rate. Parent
      and family packages are available on request as a separate itinerary.
  - key: safety-and-supervision
    title: Safety and supervision
    source: safety
    mime_type: text/markdown
    content: Teams are accompanied 24/7 by a bilingual tour leader. Hotels are in safe neighborhoods (Palermo
      in Buenos Aires, Barra da Tijuca in Rio). Transport is always private. Medical insurance with emergency
      coverage is required and we can arrange it.
  - key: entry-requirements-for-us-citizens
    title: Entry requirements for US citizens
    source: travel
    mime_type: text/markdown
    content: 'Argentina: no visa required for US passport holders for stays under 90 days; proof of
      health insurance is required for foreigners (DNU 366/2025). Costa Rica: no visa required for stays
      under 90 days. Brazil: US citizens need an electronic visa (e-visa) applied online before travel,
      only at brazil.vfsevisa.com (US$ 80.90, required since April 10, 2025); a minor''s e-visa needs the
      birth certificate and an authorization signed by both parents, so apply about two months ahead.
      Spain: no visa for up to 90 days in any 180; the passport must be valid 3 months after leaving the
      Schengen area and issued within the last 10 years; ETIAS is not in operation yet. Passports must
      be valid for the whole trip; we recommend 6 months after return because some airlines ask for it.
      Every minor travels with a notarized consent from both parents naming the group adult. This is
      guidance checked on October 23, 2026; teams must check official sources before booking flights.'

  - key: best-time-to-travel
    title: Best time to travel
    source: travel
    mime_type: text/markdown
    content: 'Argentina and Brazil are in the southern hemisphere: their winter is June to August (mild
      in Buenos Aires, 8-15°C) and summer is December to February (hot, 25-35°C). Spring break (March)
      and early summer (May-June) are the most popular windows for US college programs. Costa Rica is
      best in the dry season, December to April.'
  - key: how-we-match-opponents
    title: How we match opponents
    source: sports
    mime_type: text/markdown
    content: 'We match every opponent by sport, gender, age group and level. Level is scored 1-10: 3-4
      recreational, 5 D3 / regional club, 6 D2 / strong club, 7 D1 / ECNL-level club, 8+ pre-professional
      academies. We aim for opponents within 1 point of the visiting team so every game is competitive.
      Teams can request a mix of one stronger and one easier game.'
  - key: performance-analysis-package
    title: Performance analysis package
    source: sports
    mime_type: text/markdown
    content: 'Optional add-on: every match is filmed from an elevated angle, with a post-match video review
      session and an individual clip pack per player. Pre-match scouting reports on each opponent are
      included in the standard package.'
  - key: typical-itinerary-length
    title: Typical itinerary length
    source: trip-types
    mime_type: text/markdown
    content: Most soccer tours run 8 to 12 days with 3 or 4 matches, 3 to 5 training sessions, and 3 to
      5 cultural experiences. We leave at least one rest day between matches.
  - key: pricing-ranges
    title: Pricing ranges
    source: trip-types
    mime_type: text/markdown
    content: As a guide, a 10-day Buenos Aires soccer tour costs between $2,400 and $3,200 per person
      depending on hotel category, number of experiences and season. Rio de Janeiro is 10-15% higher.
      Costa Rica is similar to Buenos Aires.
  - key: dietary-and-medical-needs
    title: Dietary and medical needs
    source: faq
    mime_type: text/markdown
    content: We handle dietary restrictions (vegetarian, gluten free, allergies) with hotels and restaurants
      in advance. Teams send a rooming list and medical/dietary form 30 days before departure.
