# Golden Q&A for Account 360 evals (retrieval + answer grounding).
# `sources` = interaction keys from accounts.yaml that must be retrieved (recall@k) and cited.
# `answer` = the reference facts a judge checks for; wording may differ. Demo "today" is 2026-10-22.
# `account` is null for cross-account questions. `lang` is the question language.
version: 1
questions:
  # ── Lakeshore University ───────────────────────────────────────────────
  - id: q01
    account: acc-lakeshore
    lang: en
    question: How is Lakeshore University doing?
    answer: Health red. Proposal IGS-2711 (Buenos Aires, March 6–15 2027, 24 travelers, USD 2,890 pp) is drafted and waiting for ops approval to be sent. The team's enrollment fees (24 × US$95 = US$2,280) due Oct 15 haven't been paid and the hotel releases the March blocks on Oct 31; Robert Haines decides by Oct 31 and is comparing a USD 2,750 competitor quote.
    sources: [int-lak-07, int-lak-10, int-lak-12]
  - id: q02
    account: acc-lakeshore
    lang: en
    question: Who makes the final decision at Lakeshore?
    answer: Robert Haines, Senior Associate Athletic Director — signs contracts and purchase orders.
    sources: [int-lak-02]
  - id: q03
    account: acc-lakeshore
    lang: es
    question: ¿Por qué Lakeshore no pagó la inscripción?
    answer: Empezó el año fiscal el 1/10 y la línea de presupuesto cambió, así que Haines tiene que re-aprobar la PO; antes quiere ver la propuesta formal en la reunión de presupuesto del 28/10.
    sources: [int-lak-07, int-lak-08]
  - id: q04
    account: acc-lakeshore
    lang: en
    question: What happens if Lakeshore's enrollment fees don't arrive?
    answer: The hotel releases the March 6–15 hotel and field blocks on October 31 (spring break is peak season).
    sources: [int-lak-02, int-lak-03, int-lak-08]
  - id: q05
    account: acc-lakeshore
    lang: en
    question: What dietary needs does the Lakeshore team have?
    answer: Two players gluten-free and one vegetarian.
    sources: [int-lak-05]
  - id: q06
    account: acc-lakeshore
    lang: en
    question: What time does the Lakeshore team land in Buenos Aires?
    answer: March 6, 2027 at 08:40 at EZE (Delta via Atlanta, tentative); departing March 15 at 21:15.
    sources: [int-lak-04]
  - id: q07
    account: acc-lakeshore
    lang: es
    question: ¿Contra quién juega Lakeshore en marzo?
    answer: Escuela de Fútbol Femenino Sur (nivel 5) el día 3, Deportivo Belgrano Femenino (nivel 7) el día 5 y la Selección Universitaria Femenina (nivel 6, tentativa) el día 8.
    sources: [int-lak-09]
  - id: q08
    account: acc-lakeshore
    lang: en
    question: What does Lakeshore need before signing?
    answer: Registered vendor through procurement, certificate of insurance naming Lakeshore as additional insured, a USD price lock, and a formal proposal with inclusions and cancellation terms to compare against the competitor quote.
    sources: [int-lak-02, int-lak-04, int-lak-10]

  # ── Northfield College ─────────────────────────────────────────────────
  - id: q09
    account: acc-northfield
    lang: en
    question: How is the Northfield tour going?
    answer: On tour now (Oct 18–27). Arrived 3 h late, won the first match 2-1 vs Villa Urquiza, one player with a mild ankle sprain, day-6 match moved to 18:30 for referee availability. Coach very happy.
