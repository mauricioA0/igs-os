    answer: No — paid in full (USD 72,540) in August.
    sources: [int-nor-03]
  - id: q11
    account: acc-northfield
    lang: es
    question: ¿Qué pasó con el jugador lesionado de Northfield?
    answer: Esguince leve de tobillo en el entrenamiento; radiografía bien, cubierto por el seguro; se pierde el primer partido y probablemente vuelve el día 6.
