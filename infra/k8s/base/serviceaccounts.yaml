# Workload Identity: each KSA impersonates one GSA (bindings in infra/terraform). No key files.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: temporal-server
  namespace: temporal
  annotations:
    iam.gke.io/gcp-service-account: igs-temporal@mv-cloud-509914.iam.gserviceaccount.com
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: igs-worker
  namespace: igs-workers
  annotations:
    iam.gke.io/gcp-service-account: igs-worker@mv-cloud-509914.iam.gserviceaccount.com
automountServiceAccountToken: false
