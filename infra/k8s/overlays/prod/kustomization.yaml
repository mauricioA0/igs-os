apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Prod: on-demand capacity, one warm flows worker (no cold start on approvals/timers).
resources:
  - ../../base
patches:
  - target: { kind: ScaledObject, name: igs-worker-flows }
    patch: |-
      - op: replace
        path: /spec/minReplicaCount
        value: 1
      - op: replace
        path: /spec/maxReplicaCount
        value: 30
  - target: { kind: ScaledObject, name: igs-worker-ingestion }
    patch: |-
      - op: replace
        path: /spec/maxReplicaCount
        value: 20
  - target: { kind: Deployment, name: igs-worker-flows }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: "1", memory: 1Gi }
          limits: { memory: 2Gi }
