# Prod: on-demand capacity, two replicas per service spread across zones, larger requests.
# PDBs and topology spread are per-service in chart 1.x.
server:
  replicaCount: 2
  config:
    persistence:
      datastores:
        default:
          sql:
            maxConns: 50
            maxIdleConns: 50
  frontend:
    resources:
      requests: { cpu: "1", memory: 1Gi }
      limits: { memory: 1Gi }
    podDisruptionBudget: { minAvailable: 1 }
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: { app.kubernetes.io/name: temporal, app.kubernetes.io/component: frontend }
  history:
    resources:
      requests: { cpu: "2", memory: 4Gi }
      limits: { memory: 4Gi }
    podDisruptionBudget: { minAvailable: 1 }
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: { app.kubernetes.io/name: temporal, app.kubernetes.io/component: history }
  matching:
    resources:
      requests: { cpu: "1", memory: 1Gi }
      limits: { memory: 1Gi }
    podDisruptionBudget: { minAvailable: 1 }
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: { app.kubernetes.io/name: temporal, app.kubernetes.io/component: matching }
  worker:
    podDisruptionBudget: { minAvailable: 1 }
web:
  replicaCount: 2
